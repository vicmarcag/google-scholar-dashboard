<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scholar Dashboard — Options</title>
    <link rel="stylesheet" href="../sidepanel/style.css" />
    <style>
      body {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 18px;
      }
      .field-row {
        display: flex;
        gap: 8px;
        margin: 16px 0 4px;
      }
      .field-row input[type='text'] {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card-bg);
        color: var(--text);
        font-size: 13px;
      }
      .field-row button {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-size: 13px;
      }
      .error-msg {
        color: var(--error);
        font-size: 12px;
        min-height: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid var(--border);
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Scholar Dashboard — Options</h1>

    <section>
      <h2 style="font-size: 14px">Add author</h2>
      <p class="hint">
        Paste the full Google Scholar profile URL (e.g.
        https://scholar.google.com/citations?user=Jqb-LMgAAAAJ&amp;hl=en).
      </p>
      <form id="add-author-form" class="field-row">
        <input type="text" id="author-url-input" placeholder="https://scholar.google.com/citations?user=..." />
        <button type="submit">Add</button>
      </form>
      <p id="error-msg" class="error-msg"></p>
    </section>

    <section>
      <h2 style="font-size: 14px">Followed authors</h2>
      <table>
        <thead>
          <tr>
            <th>Author</th>
            <th>ID</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="authors-table-body"></tbody>
      </table>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
